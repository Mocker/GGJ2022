<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>They Might Byte - Virtual Pet Digivice</title>
    <meta name="theme-color" content="#38bdf8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game"></div>
      <div id="controls-guide">
        <span><kbd>▲</kbd> <kbd>▼</kbd> or <kbd>W</kbd> <kbd>S</kbd> Navigate</span>
        <span><kbd>ENTER</kbd> / <kbd>SPACE</kbd> Select</span>
        <span><kbd>ESC</kbd> Close</span>
        <span><kbd>◀</kbd> <kbd>▶</kbd> or <kbd>A</kbd> <kbd>D</kbd> Tabs (1, 2, 3)</span>
        <span><kbd>M</kbd> Mute</span>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('ServiceWorker registration omitted:', err);
          });
        });
      }
    </script>
  </body>
</html>
